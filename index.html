<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    >
    <meta name="theme-color" content="#1f6feb">
    <title>Погрузка машин</title>

    <!-- Иконки для вкладки браузера и главного экрана на телефоне. -->
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">

    <link
      id="app-stylesheet"
      rel="stylesheet"
      href="style.css?v=5"
    >
  </head>

  <body>
    <!-- Заголовок и кнопки управления приложением. -->
    <main>
      <header class="top">
        <h1>Погрузка</h1>
        <button class="ic" id="rules" type="button" title="Правила" aria-label="Открыть правила">
          ℹ
        </button>
        <button class="ic" id="ref" type="button" title="Обновить" aria-label="Обновить данные">
          ↻
        </button>
        <button class="ic" id="cfg" type="button" title="GitHub" aria-label="Настройки GitHub">
          ⚙
        </button>
      </header>

      <!-- JavaScript показывает здесь очередь по категориям. -->
      <div id="list"></div>

      <!-- Здесь появляются сообщения о сохранении, обновлении и ошибках. -->
      <div class="msg" id="msg" role="status" aria-live="polite"></div>
    </main>

    <!-- Кнопка сохранения закреплена внизу экрана. -->
    <div class="bar">
      <button id="save" type="button" disabled>Сохранить</button>
    </div>

    <!-- Универсальное всплывающее окно: выбор, настройки или правила. -->
    <div class="ov" id="ov">
      <section class="sheet" id="sheet"></section>
    </div>

    <script>
      // Добавляет одноразовый параметр, чтобы после Code reload скачать свежие файлы.
      (() => {
        const pageUrl = new URL(window.location.href);
        const reloadToken = pageUrl.searchParams.get("__code_reload");
        const stylesheet = document.getElementById("app-stylesheet");

        if (reloadToken && stylesheet) {
          const stylesheetUrl = new URL(stylesheet.href, window.location.href);
          stylesheetUrl.searchParams.set("__code_reload", reloadToken);
          stylesheet.href = stylesheetUrl.toString();

          const scriptUrl = new URL("app.js?v=6", window.location.href);
          scriptUrl.searchParams.set("__code_reload", reloadToken);
          pageUrl.searchParams.delete("__code_reload");
          window.history.replaceState({}, "", pageUrl.pathname + pageUrl.search + pageUrl.hash);

          const appScript = document.createElement("script");
          appScript.src = scriptUrl.toString();
          document.body.appendChild(appScript);
          return;
        }

        const appScript = document.createElement("script");
        appScript.src = "app.js?v=6";
        document.body.appendChild(appScript);
      })();
    </script>
  </body>
</html>

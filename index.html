<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6feb">
<title>Погрузка машин</title>

<link rel="stylesheet" href="style.css?v=1">
</head>

<body>
<!-- ==========================================================
     ЧАСТЬ 2. РАЗМЕТКА (из чего состоит страница)
     ========================================================== -->

<main>
  <!-- Шапка: заголовок и кнопки: ↻ обновить, ⚙ настройки GitHub -->
  <div class="top"><h1>Погрузка машин</h1><button class="ic" id="ref" title="Обновить">↻</button><button class="ic" id="cfg" title="GitHub">⚙</button></div>
  <!-- Сюда JavaScript вставляет четыре строки категорий -->
  <div id="list"></div>
  <!-- Строка сообщений: «Сохранено», «Обновлено» и ошибки -->
  <div class="msg" id="msg"></div>
</main>

<!-- Нижняя кнопка «Сохранить» -->
<div class="bar"><button id="save" disabled>Сохранить</button></div>

<!-- Всплывающее окно. Содержимое (выбор человека или настройки) вставляет JavaScript -->
<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>

<script src="app.js?v=1"></script>
</body>
</html>
